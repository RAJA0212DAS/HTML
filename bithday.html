<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Wish Maker</title>
    <style>
      :root {
        --bg: #fff7e8;
        --ink: #2d2318;
        --primary: #ff7a59;
        --secondary: #ffd166;
        --accent: #118ab2;
        --paper: rgba(255, 255, 255, 0.88);
        --line: rgba(45, 35, 24, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 20%, var(--secondary) 0 9%, transparent 10%),
          radial-gradient(circle at 86% 18%, var(--accent) 0 7%, transparent 8%),
          linear-gradient(135deg, var(--bg), color-mix(in srgb, var(--primary) 18%, var(--bg)));
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
      }

      .app {
        width: min(100%, 1080px);
        display: grid;
        grid-template-columns: 0.85fr 1.15fr;
        overflow: hidden;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.18);
      }

      .controls,
      .wish {
        padding: clamp(24px, 5vw, 56px);
      }

      .controls {
        display: grid;
        gap: 16px;
        align-content: center;
        border-right: 1px solid var(--line);
      }

      .eyebrow {
        margin: 0;
        color: var(--primary);
        font-size: 0.78rem;
        font-weight: 900;
        text-transform: uppercase;
      }

      h1,
      h2 {
        margin: 0;
        line-height: 0.96;
      }

      h1 {
        font-size: clamp(2.4rem, 7vw, 5.8rem);
      }

      h2 {
        font-size: clamp(2.8rem, 8vw, 6.8rem);
      }

      label {
        display: grid;
        gap: 7px;
        font-weight: 900;
      }

      input,
      textarea,
      select {
        width: 100%;
        min-height: 46px;
        padding: 12px 13px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font: inherit;
      }

      textarea {
        min-height: 108px;
        resize: vertical;
      }

      .wish {
        display: grid;
        gap: 28px;
        min-height: 680px;
      }

      .message {
        font-size: 1.15rem;
        line-height: 1.65;
      }

      .signature {
        width: fit-content;
        padding-top: 8px;
        border-top: 3px solid var(--secondary);
        font-weight: 900;
      }

      .stage {
        display: grid;
        min-height: 300px;
        place-items: center;
        background: color-mix(in srgb, var(--primary) 18%, transparent);
        border-radius: 8px;
      }

      .cake {
        position: relative;
        width: min(70%, 330px);
        aspect-ratio: 1;
      }

      .plate,
      .layer,
      .candle,
      .flame {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
      }

      .plate {
        bottom: 18%;
        width: 88%;
        height: 8%;
        background: #dfe7df;
        border-radius: 999px;
      }

      .layer {
        width: 74%;
        height: 19%;
        background: var(--primary);
        border-radius: 8px 8px 18px 18px;
      }

      .layer.one {
        bottom: 25%;
      }

      .layer.two {
        bottom: 43%;
        width: 60%;
        background: var(--secondary);
      }

      .layer.three {
        bottom: 60%;
        width: 44%;
        background: var(--accent);
      }

      .candle {
        bottom: 79%;
        width: 7%;
        height: 18%;
        background: repeating-linear-gradient(45deg, white 0 8px, var(--primary) 8px 14px);
        border-radius: 5px;
      }

      .flame {
        bottom: 95%;
        width: 13%;
        height: 18%;
        background: var(--secondary);
        border-radius: 60% 60% 60% 10%;
        transform: translateX(-50%) rotate(45deg);
        animation: flicker 1.1s ease-in-out infinite alternate;
      }

      button {
        min-height: 46px;
        color: white;
        background: var(--primary);
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        font: inherit;
        font-weight: 900;
      }

      @keyframes flicker {
        from {
          scale: 0.92;
        }

        to {
          scale: 1.06;
        }
      }

      @media (max-width: 840px) {
        .app {
          grid-template-columns: 1fr;
        }

        .controls {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="app">
        <form class="controls" id="wishForm">
          <p class="eyebrow">Birthday wish maker</p>
          <h1>Create a birthday page</h1>

          <label>
            Birthday person's name
            <input id="nameInput" type="text" value="DIYA" />
          </label>

          <label>
            Your message
            <textarea id="messageInput">Have a beautiful birthday filled with sweet surprises and bright moments.</textarea>
          </label>

          <label>
            From
            <input id="fromInput" type="text" value="RAJA" />
          </label>

          <label>
            Theme
            <select id="themeInput">
              <option value="sunrise">Sunrise</option>
              <option value="garden" selected>Garden</option>
              <option value="midnight">Midnight</option>
            </select>
          </label>

          <button type="submit">Update Wish</button>
        </form>

        <article class="wish">
          <div class="stage">
            <div class="cake">
              <div class="flame"></div>
              <div class="candle"></div>
              <div class="layer three"></div>
              <div class="layer two"></div>
              <div class="layer one"></div>
              <div class="plate"></div>
            </div>
          </div>

          <div>
            <p class="eyebrow" id="eyebrowText">A special day for DIYA</p>
            <h2 id="titleText">Happy Birthday, Raja!</h2>
            <p class="message" id="messageText">
              Have a beautiful birthday filled with sweet surprises and bright moments.
            </p>
            <p class="signature" id="signatureText">With love, RAJA</p>
          </div>
        </article>
      </section>
    </main>

    <script>
      const themes = {
        sunrise: {
          bg: "#fff7e8",
          ink: "#2d2318",
          primary: "#ff7a59",
          secondary: "#ffd166",
          accent: "#118ab2",
        },
        garden: {
          bg: "#f0fff4",
          ink: "#173826",
          primary: "#2d6a4f",
          secondary: "#95d5b2",
          accent: "#f77f00",
        },
        midnight: {
          bg: "#101426",
          ink: "#f8f7ff",
          primary: "#8ecae6",
          secondary: "#ffb703",
          accent: "#fb7185",
        },
      };

      const form = document.querySelector("#wishForm");
      const nameInput = document.querySelector("#nameInput");
      const messageInput = document.querySelector("#messageInput");
      const fromInput = document.querySelector("#fromInput");
      const themeInput = document.querySelector("#themeInput");
      const eyebrowText = document.querySelector("#eyebrowText");
      const titleText = document.querySelector("#titleText");
      const messageText = document.querySelector("#messageText");
      const signatureText = document.querySelector("#signatureText");

      function updateWish() {
        const name = nameInput.value.trim() || "Friend";
        const message = messageInput.value.trim() || "Have a wonderful birthday!";
        const sender = fromInput.value.trim() || "Someone who cares";
        const theme = themes[themeInput.value];

        eyebrowText.textContent = `A special day for ${name}`;
        titleText.textContent = `Happy Birthday, ${name}!`;
        messageText.textContent = message;
        signatureText.textContent = `With love, ${sender}`;

        Object.entries(theme).forEach(([key, value]) => {
          document.documentElement.style.setProperty(`--${key}`, value);
        });
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        updateWish();
      });

      [nameInput, messageInput, fromInput, themeInput].forEach((field) => {
        field.addEventListener("input", updateWish);
      });

      updateWish();
    </script>
  </body>
</html>
